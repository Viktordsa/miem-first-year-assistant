<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Первый курс · МИЭМ</title>
<style>body{margin:0;background:#f3f5f9;color:#14243c;font:17px/1.55 system-ui}main{max-width:880px;margin:65px auto;padding:24px}small{color:#506480}h1{font-size:48px;line-height:1.1;letter-spacing:-2px}select,textarea,button{box-sizing:border-box;font:inherit;padding:14px;border:1px solid #bbc7d9;border-radius:10px;width:100%;margin:7px 0}textarea{height:120px;resize:vertical}button{background:#2059db;color:white;border:0;cursor:pointer}button:disabled{opacity:.5}article{background:white;padding:28px;border-radius:16px;margin-top:24px;white-space:pre-wrap}a{color:#2059db}.sources{font-size:14px}details{margin:12px 0}summary{cursor:pointer}footer{margin-top:30px;font-size:14px;color:#506480}</style>
<main><small>ИВТ / МИЭМ НИУ ВШЭ · 2026–2027</small><h1>Разберёмся<br>с первым курсом</h1><p>Темы, оценивание и литература — по официальным программам дисциплин.</p><form id="form"><label for="course">Дисциплина</label><select id="course"><option value="">Найти по вопросу</option></select><label for="q">Ваш вопрос</label><textarea id="q" maxlength="2000" required placeholder="Какая литература рекомендована по алгебре и геометрии?"></textarea><button id="send">Найти ответ</button></form><article id="result" aria-live="polite" hidden></article><footer>База — снимок открытых программ от 22 октября 2026. Помощник выбирает выдержки из источников; сложные связи и вычисления могут потребовать самостоятельной проверки.</footer></main>
<script>const $=id=>document.getElementById(id);fetch('/api/courses').then(r=>r.json()).then(cs=>cs.forEach(c=>{const o=document.createElement('option');o.value=c.id;o.textContent=c.title;$('course').append(o)}));$('form').onsubmit=async e=>{e.preventDefault();$('send').disabled=true;const box=$('result');box.hidden=false;box.textContent='Ищу в программах…';try{const r=await fetch('/api/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:$('q').value,course:$('course').value})});const d=await r.json();box.textContent=d.answer||d.error;if(d.note){const p=document.createElement('p');p.textContent=d.note;box.append(p)}(d.sources||[]).forEach((s,i)=>{const p=document.createElement('p');p.className='sources';const a=document.createElement('a');a.href=s.url;a.target='_blank';a.rel='noopener';a.textContent=`[${i+1}] ${s.title} · ${s.section}`;p.append(a);box.append(p);if(s.evidence){const detail=document.createElement('details');const sum=document.createElement('summary');sum.textContent='Найденный фрагмент';detail.append(sum,document.createTextNode(s.evidence));box.append(detail)}})}catch{box.textContent='Не удалось получить ответ. Проверьте, что сервер запущен.'}finally{$('send').disabled=false}};</script></html>
